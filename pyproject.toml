[project]
name = "matrix_admin_bot"
description = "Admin bot"
authors = [{ name = "Tchap Team", email = "tech@tchap.beta.gouv.fr" }]
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "tchap-bot",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "pyotp>=2.10.0,<3",
    "structlog",
    "matrix-nio",
    "requests",
]
dynamic = ["version"]

[project.scripts]
matrix-admin-bot = "matrix_admin_bot.adminbot:main"
tchap-admin-bot = "tchap_admin_bot.tchapadminbot:main"

[dependency-groups]
dev = [
    "ruff>=0.16.6,<0.17",
    "basedpyright>=1.39.10,<2",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.sdist]
include = [
    "matrix_admin_bot",
    "matrix_command_bot",
    "tchap_admin_bot",
]

[tool.hatch.build.targets.wheel]
include = [
    "matrix_admin_bot",
    "matrix_command_bot",
    "tchap_admin_bot",
]

[tool.uv]

[tool.uv.sources]
tchap-bot = { git = "https://code.peren.fr/MatMaul/tchapbot.git", rev = "6d5dc977f4ad83810df97069d454a29e47c761d9" }

[tool.pyright]
pythonVersion = "3.13"

typeCheckingMode = "strict"

reportAny = false
reportUnknownMemberType = false
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportUnusedParameter = false

executionEnvironments = [
  { root = "tests", reportAttributeAccessIssue = false },
]

# TODO add more typing
reportUnannotatedClassAttribute = false

[tool.ruff.lint]
select = [
"ALL"
]
ignore = [
    "TD",       # TODO formatting
    "ISC001",   # This rule conflicts with ruff formatter
    "COM812",   # Trailing comma missing
    "PLR2004",  # Magic value used in comparison
    "PLR0913",  # Too many arguments in function definition
    "TC001",   # Move application import into a type-checking block
    "ASYNC110", # Use `anyio.Event` instead of awaiting `anyio.sleep` in a `while` loop
    "CPY001",   # Do not mandate copyright notice on all files

    # TO BE FIXED !!
    "TRY002",   # Create your own exception
    "FIX002",   # Line contains TODO, consider resolving the issue
    "D",        # Missing docstring
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "INP001",  # File is part of an implicit namespace package. Add an `__init__.py`
    "PLW0603", # Using the global statement to update variable is discouraged
    "S101",    # Use of `assert` detected
    "S105",    # Possible hardcoded password assigned
    "DTZ005",  # `datetime.datetime.now()` called without a `tz` argument
]

[tool.coverage.run]
source = [
    "matrix_admin_bot",
    "matrix_command_bot",
    "tchap_admin_bot"
]
